name: Publish Rendriva Release

on:
  push:
    branches: ["main"]
    paths:
      - "dist/rendriva-chatgpt-skill-v1.6.0.zip"
      - "dist/rendriva-chatgpt-skill-v1.6.0.zip.sha256"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify release package
        run: |
          sha256sum -c dist/rendriva-chatgpt-skill-v1.6.0.zip.sha256
          unzip -t dist/rendriva-chatgpt-skill-v1.6.0.zip
          unzip -Z1 dist/rendriva-chatgpt-skill-v1.6.0.zip | grep -qx 'SKILL.md'
      - name: Publish GitHub Release with installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v1.6.0" >/dev/null 2>&1 && exit 0
          gh release create "v1.6.0" \
            dist/rendriva-chatgpt-skill-v1.6.0.zip \
            dist/rendriva-chatgpt-skill-v1.6.0.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Rendriva v1.6.0 — Commerce Production Suite" \
            --notes "Adds exact SKU-to-output mapping, garment construction and product visibility locks, reference preflight, rollback-safe localized repair, SKU color QA, commerce shot direction, approval checkpoints, campaign defect memory, and video continuity handoff. Includes Single Model Face Lock and all prior production controls."
