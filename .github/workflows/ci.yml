name: Rendriva CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r rendriva-image-agent/scripts/requirements.txt
      - name: Compile adapter
        run: python -m py_compile rendriva-image-agent/scripts/rendriva.py
      - name: Run tests
        run: python -m unittest discover -s rendriva-image-agent/scripts/tests -v
      - name: Validate example job
        run: python rendriva-image-agent/scripts/rendriva.py rendriva-image-agent/scripts/example-job.json --dry-run
      - name: Verify downloadable skill package
        run: |
          sha256sum -c dist/rendriva-chatgpt-skill-v1.1.0.zip.sha256
          unzip -t dist/rendriva-chatgpt-skill-v1.1.0.zip
          unzip -Z1 dist/rendriva-chatgpt-skill-v1.1.0.zip | grep -qx 'SKILL.md'
          unzip -p dist/rendriva-chatgpt-skill-v1.1.0.zip scripts/rendriva.py | grep -q 'VERSION = "1.1.0"'
